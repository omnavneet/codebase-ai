# =============================================================================
# PRODUCTION deployment stack. Run with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Hardening differences from the development docker-compose.yml:
#   * Postgres and MailHog publish NO host ports (MailHog is omitted entirely -
#     a real SMTP provider is required via the SPRING_MAIL_* variables).
#   * Every secret uses ${VAR:?...}, so compose refuses to start with gaps.
#   * The refresh cookie keeps its secure default (APP_COOKIE_SECURE=true):
#     serve the app over HTTPS - terminate TLS at this frontend's nginx (see
#     the commented TLS block in frontend/nginx.conf) or at an upstream load
#     balancer that sets X-Forwarded-Proto honestly.
# =============================================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - codebase-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:?AI_SERVICE_INTERNAL_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOAD_DIR: /app/uploads
      # --- Project storage ---------------------------------------------------
      # Must match the backend's provider, because the agent's file tools
      # (list_files / read_file / grep) read whatever the backend wrote. With
      # provider=s3 nothing lands in the mount above, so these three variables
      # are what point the tools at the bucket instead.
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:?APP_STORAGE_PROVIDER}
      # Blank with provider=s3 fails fast at startup; blank with local is fine.
      APP_S3_BUCKET: ${APP_S3_BUCKET:-}
      APP_S3_PREFIX: ${APP_S3_PREFIX:-projects}
      # Blank falls back to the AWS default region chain.
      APP_S3_REGION: ${APP_S3_REGION:-}
      # Credentials follow the same rule as the backend: boto3's default chain
      # (task role on ECS/EC2, or AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in
      # the platform's environment settings for a plain VM or PaaS), so no key
      # is ever listed here.
    volumes:
      - project-uploads:/app/uploads
    networks:
      - codebase-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_UPLOAD_DIRECTORY: /app/uploads
      # --- Project storage ---------------------------------------------------
      # Required (no default) on purpose: a production deploy must state where
      # project files live, so it cannot silently keep them on the container
      # volume. "local" keeps the shared volume; "s3" keeps nothing on disk.
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:?APP_STORAGE_PROVIDER}
      # Leaving this blank with provider=s3 fails fast at startup, so no default.
      APP_S3_BUCKET: ${APP_S3_BUCKET:-}
      APP_S3_PREFIX: ${APP_S3_PREFIX:-projects}
      # Blank falls back to the AWS default region chain.
      APP_S3_REGION: ${APP_S3_REGION:-}
      # Credentials are deliberately NOT listed: the AWS SDK reads the default
      # provider chain, so on ECS/EC2 the task role or instance profile supplies
      # them and no key ever appears in configuration. On a plain VM or PaaS set
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY directly in the platform's
      # environment settings (PaaS dashboard or host export); pass them through
      # Compose only if you have no other option:
      #   AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID}
      #   AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY}
      APP_AI_SERVICE_URL: http://ai-service:8000
      APP_AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN}
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET}
      # Reachable only from the frontend nginx container (no published port),
      # so X-Forwarded-For can be trusted - without it every visitor would
      # share the proxy's single IP in the per-IP rate limiter.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Production must serve HTTPS, so the refresh cookie stays Secure (this
      # is also the backend's default; set explicitly to make it visible).
      APP_COOKIE_SECURE: "true"
      # Real SMTP provider (SES/Postmark/etc.); unauthenticated plaintext mail
      # is not acceptable for verification links.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:?SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      APP_MAIL_FROM: ${APP_MAIL_FROM:?APP_MAIL_FROM}
      # Public HTTPS origin of the SPA; verification links are built from it.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL}
    volumes:
      - project-uploads:/app/uploads
    networks:
      - codebase-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      # wget is a busybox applet in the JRE-alpine image (same pattern the
      # frontend uses). Non-2xx makes wget exit non-zero, so a 503 from
      # /api/health correctly reports the backend unhealthy.
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Cover JVM boot plus the initial Flyway migration on a cold database.
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - codebase-network
    restart: unless-stopped
    depends_on:
      - backend
    # When TLS terminates at an upstream load balancer keep 80; when serving
    # directly, enable the TLS block in frontend/nginx.conf and also publish
    # "443:443" with the certificate mounted into the container.
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  project-uploads:

networks:
  codebase-network:
    driver: bridge
