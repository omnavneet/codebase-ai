name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: chmod +x mvnw && ./mvnw -B test

  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run AI service tests
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check frontend
        run: npm run build

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hardened stack refuses to start without every secret (${VAR:?}), so
      # supply throwaway values. Nothing here reaches AWS, Groq or an SMTP server;
      # these only have to be present and syntactically valid for the app to boot.
      - name: Write throwaway .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=smoke-db-password
          POSTGRES_DB=codebase_ai
          JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AI_SERVICE_INTERNAL_TOKEN=0123456789abcdef0123456789abcdef
          GROQ_API_KEY=smoke-test-key-not-used
          LLM_MODEL=openai/gpt-oss-20b
          SPRING_MAIL_HOST=smtp.invalid
          SPRING_MAIL_PORT=587
          SPRING_MAIL_USERNAME=smoke@invalid
          SPRING_MAIL_PASSWORD=smoke-mail-password
          APP_MAIL_FROM=no-reply@invalid
          APP_PUBLIC_URL=http://localhost:3000
          FRONTEND_PORT=3000
          # The hardened stack requires a storage provider to be named. CI has no
          # S3 credentials or bucket, so the smoke test exercises the local
          # provider on the shared volume (which is what the health checks and
          # the AI service's file tools assume here).
          APP_STORAGE_PROVIDER=local
          EOF

      # --wait blocks until every service with a healthcheck reports healthy, so
      # this single step also exercises the backend healthcheck added for ECS/ALB.
      - name: Build and start the hardened stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 900

      - name: Frontend serves the SPA shell
        run: curl -fsS http://localhost:3000/ | grep -qi '<div id="root">'

      - name: Backend /api/health is UP (reached through the nginx /api proxy)
        run: curl -fsS http://localhost:3000/api/health | grep -q '"status":"UP"'

      - name: AI service /health responds
        run: |
          docker compose -f docker-compose.prod.yml exec -T ai-service \
            python -c "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"

      - name: MCP tool server /health responds
        run: |
          docker compose -f docker-compose.prod.yml exec -T mcp \
            python -c "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').status == 200 else 1)"

      # On a fresh volume the backend applies the whole Flyway migration set at
      # startup; assert the history actually recorded successful migrations.
      - name: Flyway migrated the fresh database
        run: |
          applied=$(docker compose -f docker-compose.prod.yml exec -T -e PGPASSWORD=smoke-db-password \
            postgres psql -U admin -d codebase_ai -tAc \
            "select count(*) from flyway_schema_history where success")
          echo "Successful migrations: $applied"
          test "${applied//[[:space:]]/}" -gt 0

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  retrieval-eval:
    # Evaluation harness gate: indexes the pinned benchmark snapshots through
    # the real indexing path and fails the build when retrieval quality drops
    # below the thresholds recorded in eval/config.json (committed baseline
    # minus a small margin). No Groq key is needed or provided here - only
    # embedding models and HTTP endpoints are exercised.
    name: Retrieval eval gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the codebase-ai benchmark is pinned to a commit that
          # is behind HEAD, and the default shallow (depth 1) checkout would not
          # contain it, so every expected file would verify as "missing".
          fetch-depth: 0

      - name: Start Postgres (pgvector) and MailHog
        run: |
          docker run -d --name eval-db -e POSTGRES_USER=admin \
            -e POSTGRES_PASSWORD=eval-password -e POSTGRES_DB=codebase_ai \
            -p 5432:5432 pgvector/pgvector:pg16
          docker run -d --name eval-mail -p 1025:1025 -p 8025:8025 mailhog/mailhog
          for i in $(seq 1 30); do
            docker exec eval-db pg_isready -U admin && break
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Cache the embedding model (sentence-transformers / HF hub)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: emb-all-MiniLM-L6-v2-${{ hashFiles('ai-service/requirements.txt') }}

      - name: Install Python dependencies (requests + AI service)
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt requests

      - name: Fetch pinned benchmark datasets
        # eval/datasets/ is git-ignored; the gate verifies every expected file
        # against the pinned commits, so the external repos must be cloned first.
        run: python -m eval.fetch_datasets

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start AI service and backend
        env:
          AI_SERVICE_INTERNAL_TOKEN: ci-internal-token-0123456789abcdef
          # Placeholder only: the retrieval suite never calls an LLM, the
          # client just refuses to boot with an unset key.
          GROQ_API_KEY: ci-placeholder-not-a-real-key
          LLM_MODEL: openai/gpt-oss-20b
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: codebase_ai
          DB_USER: admin
          DB_PASSWORD: eval-password
          APP_STORAGE_PROVIDER: local
          APP_JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
          APP_AI_SERVICE_INTERNAL_TOKEN: ci-internal-token-0123456789abcdef
          SPRING_DATASOURCE_PASSWORD: eval-password
          APP_COOKIE_SECURE: 'false'
        run: |
          mkdir -p backend/uploads
          cp backend/src/main/resources/application.properties.example \
             backend/src/main/resources/application.properties
          chmod +x backend/mvnw
          (cd ai-service && nohup python main.py > ../ai-service.log 2>&1 &)
          (cd backend && nohup ./mvnw spring-boot:run -Dmaven.test.skip=true > ../backend.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health > /dev/null && break
            sleep 5
          done
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8000/health

      - name: Run retrieval eval gate
        run: python -m eval.run --gate

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: docs/eval/

      - name: Service logs on failure
        if: failure()
        run: tail -n 200 ai-service.log backend.log

