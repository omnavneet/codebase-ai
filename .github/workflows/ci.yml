name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: chmod +x mvnw && ./mvnw -B test

  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run AI service tests
        run: python -m unittest discover -s . -p 'test_*.py'

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check frontend
        run: npm run build

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hardened stack refuses to start without every secret (${VAR:?}), so
      # supply throwaway values. Nothing here reaches AWS, Groq or an SMTP server;
      # these only have to be present and syntactically valid for the app to boot.
      - name: Write throwaway .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=smoke-db-password
          POSTGRES_DB=codebase_ai
          JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AI_SERVICE_INTERNAL_TOKEN=0123456789abcdef0123456789abcdef
          GROQ_API_KEY=smoke-test-key-not-used
          LLM_MODEL=openai/gpt-oss-20b
          SPRING_MAIL_HOST=smtp.invalid
          SPRING_MAIL_PORT=587
          SPRING_MAIL_USERNAME=smoke@invalid
          SPRING_MAIL_PASSWORD=smoke-mail-password
          APP_MAIL_FROM=no-reply@invalid
          APP_PUBLIC_URL=http://localhost:3000
          FRONTEND_PORT=3000
          # The hardened stack requires a storage provider to be named. CI has no
          # S3 credentials or bucket, so the smoke test exercises the local
          # provider on the shared volume (which is what the health checks and
          # the AI service's file tools assume here).
          APP_STORAGE_PROVIDER=local
          EOF

      # --wait blocks until every service with a healthcheck reports healthy, so
      # this single step also exercises the backend healthcheck added for ECS/ALB.
      - name: Build and start the hardened stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 900

      - name: Frontend serves the SPA shell
        run: curl -fsS http://localhost:3000/ | grep -qi '<div id="root">'

      - name: Backend /api/health is UP (reached through the nginx /api proxy)
        run: curl -fsS http://localhost:3000/api/health | grep -q '"status":"UP"'

      - name: AI service /health responds
        run: |
          docker compose -f docker-compose.prod.yml exec -T ai-service \
            python -c "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"

      # On a fresh volume the backend applies the whole Flyway migration set at
      # startup; assert the history actually recorded successful migrations.
      - name: Flyway migrated the fresh database
        run: |
          applied=$(docker compose -f docker-compose.prod.yml exec -T -e PGPASSWORD=smoke-db-password \
            postgres psql -U admin -d codebase_ai -tAc \
            "select count(*) from flyway_schema_history where success")
          echo "Successful migrations: $applied"
          test "${applied//[[:space:]]/}" -gt 0

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
