spring.datasource.url=jdbc:postgresql://localhost:5432/codebase_ai
spring.datasource.username=admin
spring.datasource.password=devpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

app.jwt.secret=dev-secret-key-change-in-production-1234567890
app.jwt.access-token-validity-ms=900000
app.jwt.refresh-token-validity-ms=604800000