spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/codebase_ai
    username: admin
    password: devpassword
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Custom config
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-1234567890}
    access-token-validity-ms: 900000      # 15 minutes
    refresh-token-validity-ms: 604800000  # 7 days